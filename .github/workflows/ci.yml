name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend deps
        run: npm --prefix anthola_fullstack/frontend/anthola\ tours\ and\ travel install
      - name: Build frontend
        run: npm --prefix anthola_fullstack/frontend/anthola\ tours\ and\ travel run build
      - name: Install backend deps
        run: npm --prefix anthola_fullstack/backend install
